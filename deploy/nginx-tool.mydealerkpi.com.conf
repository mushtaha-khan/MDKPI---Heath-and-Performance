# nginx reverse-proxy config for the Dealership Testing tool.
#
# The tool uses Server-Sent Events (SSE) for the live dashboard (/events, /perf/events).
# Proxies BUFFER responses by default, which breaks SSE — the browser shows
# "stream closed (is the server running?)". This config disables buffering on the SSE
# endpoints and keeps the long-lived streaming connections open.
#
# Assumes the Node server runs on the same host, port 5174. Adjust `proxy_pass` host if the
# Node app is on a different machine (e.g. http://172.17.1.115:5174).
#
# Install: put this in /etc/nginx/sites-available/, symlink into sites-enabled/, then
#   sudo nginx -t && sudo systemctl reload nginx

upstream mdkpi_tool {
    server 127.0.0.1:5174;
    keepalive 32;
}

server {
    listen 80;
    server_name tool.mydealerkpi.com;

    # --- SSE streams: MUST NOT be buffered, and need long read timeouts ---
    location ~ ^/(perf/)?events$ {
        proxy_pass http://mdkpi_tool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The critical bits for SSE:
        proxy_buffering off;              # don't buffer the stream
        proxy_cache off;                  # don't cache it
        proxy_set_header Connection '';   # keep the upstream connection alive
        chunked_transfer_encoding off;    # stream as-is
        proxy_read_timeout 1h;            # a crawl can run a long time; don't cut the stream
        proxy_send_timeout 1h;
    }

    # --- everything else (UI, /start, /reports, /settings, /shot, exports, API) ---
    location / {
        proxy_pass http://mdkpi_tool;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;          # discovery + exports can take a while
        proxy_send_timeout 300s;
    }
}

# NOTE: this port/host has NO built-in authentication. Anyone who can reach
# tool.mydealerkpi.com can start crawls and view/change the dealer credentials in Settings.
# Strongly recommend adding auth at this layer, e.g.:
#   location / { auth_basic "Restricted"; auth_basic_user_file /etc/nginx/.htpasswd; ... }
# (create with: sudo htpasswd -c /etc/nginx/.htpasswd <user>)
# and/or restrict by IP:  allow 172.17.1.0/24;  deny all;
